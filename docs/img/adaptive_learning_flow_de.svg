<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="600" height="320" xmlns="http://www.w3.org/2000/svg">
 <g font-family="Arial" font-size="15">
  <rect x="40" y="30" width="180" height="40" fill="#e3f2fd" stroke="#1976d2"/>
  <text x="130" y="55" text-anchor="middle">Audiodatei bereitstellen</text>

  <rect x="250" y="30" width="180" height="40" fill="#e8f5e9" stroke="#388e3c"/>
  <text x="340" y="55" text-anchor="middle">Sprecherprofil erstellen</text>

  <rect x="40" y="110" width="180" height="40" fill="#fffde7" stroke="#fbc02d"/>
  <text x="130" y="135" text-anchor="middle">Modell anpassen</text>

  <rect x="250" y="110" width="180" height="40" fill="#ffebee" stroke="#c62828"/>
  <text x="340" y="135" text-anchor="middle">Audio transkribieren</text>

  <rect x="145" y="200" width="180" height="40" fill="#ede7f6" stroke="#512da8"/>
  <text x="235" y="225" text-anchor="middle">Feedback & Profil verbessern</text>

  <!-- Pfeile -->
  <line x1="220" y1="50" x2="250" y2="50" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="130" y1="70" x2="130" y2="110" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="340" y1="70" x2="340" y2="110" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="220" y1="130" x2="250" y2="130" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="235" y1="150" x2="235" y2="200" stroke="#333" marker-end="url(#arrow)"/>
  <line x1="235" y1="240" x2="130" y2="70" stroke="#333" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#333" />
    </marker>
  </defs>
 </g>
</svg>
